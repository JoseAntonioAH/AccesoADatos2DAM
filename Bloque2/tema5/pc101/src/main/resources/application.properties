spring.application.name=pc101

! Propiedades de las dependencias

! se almacena la base de datos en memoria
# spring.datasource.url=jdbc:h2:mem:gimnasio

! se almacena la base de datos en un archivo
spring.datasource.url=jdbc:h2:file:~/data/gimnasio;

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

! Para poder acceder a la consola sql a traves del navegador
spring.h2.console.enabled=true

! Ejecuta el sql siempre que se ejecuta la aplicacion
spring.sql.init.mode=always

! Cambiar el puerto que usa
server.port:8081